<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FreelanceHub – Service Marketplace</title>
  <link rel="stylesheet" href="style.css">
  <link rel="script" href="index.js">
</head>
<body>
  <header class="topbar">
    <div class="logo">Freelance<span>Hub</span></div>
    <nav>
      <button class="nav-btn active" data-view="browse">Discover</button>
      <button class="nav-btn" data-view="dashboard">Dashboard</button>
      <select id="roleSelect" title="Switch role">
        <option value="client">I'm a Client</option>
        <option value="freelancer">I'm a Freelancer</option>
      </select>
    </nav>
  </header>

  <main>
    <!-- DISCOVER VIEW -->
    <section id="browse" class="view">
      <div class="hero">
        <h1>Find the right freelancer for your project</h1>
        <p>Browse profiles, compare services, and send your requirements.</p>
      </div>

      <div class="filters">
        <input type="search" id="search" placeholder="Search name, skill or service...">
        <select id="category">
          <option value="">All categories</option>
          <option>Web Development</option>
          <option>Design</option>
          <option>Writing</option>
          <option>Marketing</option>
          <option>Video</option>
        </select>
        <select id="maxPrice">
          <option value="">Any budget</option>
          <option value="50">Up to $50</option>
          <option value="150">Up to $150</option>
          <option value="500">Up to $500</option>
        </select>
        <select id="sort">
          <option value="rating">Top rated</option>
          <option value="low">Price: low to high</option>
          <option value="high">Price: high to low</option>
        </select>
      </div>

      <p id="resultCount" class="muted"></p>
      <div id="grid" class="grid"></div>
    </section>

    <!-- DASHBOARD VIEW -->
    <section id="dashboard" class="view hidden">
      <h2 id="dashTitle"></h2>
      <div id="stats" class="stats"></div>
      <div id="requestList"></div>
    </section>
  </main>

  <!-- MODAL -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button class="close" onclick="closeModal()">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="script.js"></script>
</body>
</html>
